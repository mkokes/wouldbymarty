# Checks, builds and deploys the site to GitHub Pages.
#
# - Pull requests: lint, format check, tests and build only (no deploy, no token refresh).
# - Pushes to main: the same checks; deploys only if the commit came from a merged PR,
#   so direct pushes to main never go live.
# - Daily schedule and manual runs: rebuild with fresh Instagram posts, refresh the
#   Instagram access token and deploy.
#
# Merges are detected from the push to main (not the PR "closed" event) because the
# github-pages environment only allows deployments from main.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   INSTAGRAM_ACCESS_TOKEN  long-lived Instagram token
#   GH_SECRETS_TOKEN        fine-grained PAT for this repo with "Secrets: Read and write",
#                           used to save the refreshed Instagram token back to the secret above

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Decide whether to deploy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            pull_request)
              deploy=false ;;
            push)
              merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
              if [ "$merged" -gt 0 ]; then deploy=true; else deploy=false; fi
              echo "Commit from a merged PR: $deploy" ;;
            *)
              deploy=true ;;
          esac
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --workspace web
      - name: Check formatting
        run: npm run format:check --workspace web
      - name: Test
        run: npm test --workspace web
      - name: Build
        run: npm run build --workspace web
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_SECRETS_TOKEN: ${{ steps.gate.outputs.deploy == 'true' && secrets.GH_SECRETS_TOKEN || '' }}
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
